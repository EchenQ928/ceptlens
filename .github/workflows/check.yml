name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            content-lab/package-lock.json
      - run: bash -n deploy/ceptlens-deploy.sh
      - run: npm run setup
      - run: npm run check:all
