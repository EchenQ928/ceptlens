name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy main, or inspect server storage permissions without changes
        type: choice
        default: deploy
        options: [deploy, inspect]
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' || inputs.operation == 'inspect' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - if: ${{ inputs.operation != 'inspect' }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            content-lab/package-lock.json
      - if: ${{ inputs.operation != 'inspect' }}
        run: npm run setup
      - if: ${{ inputs.operation != 'inspect' }}
        run: npm run check:all
      - name: Prepare release
        if: ${{ inputs.operation != 'inspect' }}
        run: |
          git archive --format=tar.gz --output="/tmp/ceptlens-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          # Only package cache content, never npm config, credentials or logs.
          tar -czf "/tmp/ceptlens-npm-${GITHUB_SHA}.tar.gz" -C "$(npm config get cache)" _cacache
      - name: Verify offline dependency installation
        if: ${{ inputs.operation != 'inspect' }}
        run: |
          verify="$RUNNER_TEMP/ceptlens-offline"
          mkdir -p "$verify/source" "$verify/cache"
          tar -xzf "/tmp/ceptlens-${GITHUB_SHA}.tar.gz" -C "$verify/source"
          tar -xzf "/tmp/ceptlens-npm-${GITHUB_SHA}.tar.gz" -C "$verify/cache"
          npm ci --prefix "$verify/source" --offline --cache "$verify/cache" --include=dev --no-audit --no-fund
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.CEPTLENS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ceptlens_deploy
          chmod 600 ~/.ssh/ceptlens_deploy
          ssh-keyscan -H "${{ secrets.CEPTLENS_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect server storage permissions
        if: ${{ inputs.operation == 'inspect' }}
        run: |
          scp -i ~/.ssh/ceptlens_deploy scripts/inspect-storage.mjs "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}:/srv/ceptlens/releases/inspect-storage-${GITHUB_SHA}.mjs"
          ssh -i ~/.ssh/ceptlens_deploy "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}" \
            "sudo node /srv/ceptlens/releases/inspect-storage-${GITHUB_SHA}.mjs"
      - name: Inspect HTTPS routing and certificates
        if: ${{ inputs.operation == 'inspect' }}
        run: |
          scp -i ~/.ssh/ceptlens_deploy scripts/inspect-https.sh "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}:/srv/ceptlens/releases/inspect-https-${GITHUB_SHA}.sh"
          ssh -i ~/.ssh/ceptlens_deploy "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}" \
            "sudo bash /srv/ceptlens/releases/inspect-https-${GITHUB_SHA}.sh"
      - name: Upload release
        if: ${{ inputs.operation != 'inspect' }}
        run: scp -i ~/.ssh/ceptlens_deploy /tmp/ceptlens-${GITHUB_SHA}.tar.gz /tmp/ceptlens-npm-${GITHUB_SHA}.tar.gz "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}:/srv/ceptlens/releases/"
      - name: Install deployment coordinator
        if: ${{ inputs.operation != 'inspect' }}
        run: |
          scp -i ~/.ssh/ceptlens_deploy deploy/ceptlens-deploy.sh "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}:/srv/ceptlens/releases/ceptlens-deploy-${GITHUB_SHA}.sh"
          ssh -i ~/.ssh/ceptlens_deploy "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}" \
            "sudo install -o root -g root -m 0755 /srv/ceptlens/releases/ceptlens-deploy-${GITHUB_SHA}.sh /usr/local/bin/ceptlens-deploy-v3"
      - name: Activate release and health check
        if: ${{ inputs.operation != 'inspect' }}
        run: |
          ssh -i ~/.ssh/ceptlens_deploy "${{ secrets.CEPTLENS_DEPLOY_USER }}@${{ secrets.CEPTLENS_DEPLOY_HOST }}" \
            "sudo /usr/local/bin/ceptlens-deploy-v3 ceptlens-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
      - name: Verify public HTTPS delivery
        if: ${{ inputs.operation != 'inspect' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 https://ceptlens.com/api/content/status > "$RUNNER_TEMP/ceptlens-public-status.json"
          node -e 'const s=require(process.argv[1]); if(!s.ok || !s.contentRevision) process.exit(1); console.log(JSON.stringify({ok:s.ok,contentRevision:s.contentRevision,questionCount:s.questionCount,termCount:s.termCount}));' "$RUNNER_TEMP/ceptlens-public-status.json"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 https://ceptlens.com/ > "$RUNNER_TEMP/ceptlens-public.html"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html=readFileSync(process.argv[1], "utf8");
            const scripts=[...html.matchAll(/<script[^>]*src="([^"]+)"/g)].map(m=>m[1]);
            const styles=[...html.matchAll(/<link[^>]*href="([^"]+\.css)"/g)].map(m=>m[1]);
            if(!scripts.length || !styles.length) throw new Error("Public entry assets missing");
            for(const path of [...scripts,...styles]) {
              const url=new URL(path,"https://ceptlens.com/");
              if(url.origin!=="https://ceptlens.com") throw new Error("Unexpected asset origin");
              const response=await fetch(url);
              if(!response.ok) throw new Error(`Public asset failed: ${url.pathname} ${response.status}`);
              console.log(`Public asset OK: ${url.pathname}`);
            }
          ' "$RUNNER_TEMP/ceptlens-public.html"
